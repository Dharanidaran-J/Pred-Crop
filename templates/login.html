{% extends "base.html" %}

{% block title %}Log In – AgriPredict AI{% endblock %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
  <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem 2rem; box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 44px; height: 44px; font-size: 1.4rem;">
        <i class="fa-solid fa-seedling"></i>
      </div>
      <h2 style="font-size: 1.8rem; font-weight: 800; color: var(--dark); margin-bottom: 0.35rem;">
        Welcome Back
      </h2>
      <p style="color: var(--text-muted); font-size: 0.95rem;">
        Log in to access your saved predictions and personalized farm analytics.
      </p>
    </div>

    <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div style="position: relative;">
          <input type="email" class="form-control" id="email" name="email" placeholder="farmer@example.com" required style="padding-left: 2.5rem;">
          <i class="fa-solid fa-envelope" style="position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div style="position: relative;">
          <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required style="padding-left: 2.5rem;">
          <i class="fa-solid fa-lock" style="position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 0.5rem;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account yet? 
      <a href="{{ url_for('register') }}" style="font-weight: 700; color: var(--primary);">Create an account</a>
    </div>

  </div>
</div>
{% endblock %}
